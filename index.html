<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Sin Gluten - Bélgica</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen antialiased">

    <!-- Encabezado Principal -->
    <header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white py-10 shadow-lg text-center">
        <h1 class="text-4xl font-extrabold tracking-wide drop-shadow-sm">🇧🇪 Guía Sin Gluten</h1>
        <p class="text-emerald-100 mt-2 text-lg">Tu comida segura en Bruselas, Gante y Brujas</p>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8">
        
        <!-- Panel de Búsqueda y Selección -->
        <div class="bg-white rounded-2xl shadow-md p-6 mb-8 border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                🚀 Panel de Búsqueda
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Selector de Ciudad -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <label class="block text-sm font-bold text-emerald-700 uppercase tracking-wider mb-2">
                        1. Elige una Ciudad
                    </label>
                    <select id="selectorCiudad" onchange="cambiarCiudad()" class="w-full p-3 bg-white border border-gray-300 rounded-lg font-medium shadow-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none cursor-pointer transition-all">
                        <option value="" disabled selected>Selecciona destino...</option>
                        <option value="bruselas">Bruselas</option>
                        <option value="gante">Gante</option>
                        <option value="brujas">Brujas</option>
                    </select>
                </div>

                <!-- Buscador en Tiempo Real -->
                <div id="panelBusqueda" class="bg-gray-50 p-4 rounded-xl border border-gray-200 opacity-40 pointer-events-none transition-all duration-300">
                    <label class="block text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">
                        2. Filtrar por Nombre o Tipo
                    </label>
                    <input type="text" id="buscador" oninput="filtrarLugares()" placeholder="Ej. Pizza, Hamburguesa, Nombre..." class="w-full p-2.5 bg-white border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none placeholder-gray-400">
                </div>

            </div>
        </div>

        <!-- BARRA DE ESTADO / MENSAJES INFORMATIVOS -->
        <div id="mensajeEstado" class="text-center py-4 px-6 text-gray-600 bg-amber-50 border border-amber-200 rounded-xl mb-8 font-medium shadow-sm transition-all">
            👋 ¡Bienvenido! Selecciona una ciudad para cargar los lugares automáticamente desde tu GitHub.
        </div>

        <!-- CONTENEDOR DE TARJETAS (Resultados) -->
        <div class="mb-4">
            <h2 id="tituloResultados" class="text-2xl font-black text-gray-800 hidden mb-6">
                📍 Sitios sin Gluten Encontrados
            </h2>
            <div id="listaLugares" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

    </main>

    <script>
        // =========================================================================
        // ⚙️ CONFIGURACIÓN DE TU REPOSITORIO DE GITHUB
        // Reemplaza estos valores con tus datos reales de GitHub para conectar los archivos
        // =========================================================================
        const GITHUB_USER = "carbelto"; 
        const GITHUB_REPO = "gluten-free";
        const GITHUB_BRANCH = "main"; // Cambia a "master" si tu rama principal se llama así
        // =========================================================================

        let lugaresActuales = [];

        // Esta función descarga el JSON desde GitHub de forma automática al cambiar la ciudad
        async function cambiarCiudad() {
            const ciudad = document.getElementById('selectorCiudad').value;
            const panelBusqueda = document.getElementById('panelBusqueda');
            const mensajeEstado = document.getElementById('mensajeEstado');
            const tituloResultados = document.getElementById('tituloResultados');
            const buscador = document.getElementById('buscador');
            const contenedor = document.getElementById('listaLugares');

            // Limpiar la pantalla de búsquedas anteriores
            buscador.value = '';
            contenedor.innerHTML = '';
            tituloResultados.classList.add('hidden');
            panelBusqueda.classList.add('opacity-40', 'pointer-events-none');

            // Mensaje de carga animado
            mensajeEstado.className = "text-center py-4 px-6 text-blue-800 bg-blue-50 border border-blue-200 rounded-xl mb-8 font-semibold animate-pulse";
            mensajeEstado.innerHTML = `⏳ Cargando datos de <b>${ciudad.toUpperCase()}</b> automáticamente...`;

            // URL directa al archivo en tu repositorio de GitHub
            const urlJson = `https://githubusercontent.com{GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/lugares_${ciudad}.json`;

            try {
                const respuesta = await fetch(urlJson);
                
                if (!respuesta.ok) {
                    throw new Error(`No se pudo acceder al archivo lugares_${ciudad}.json`);
                }

                // El navegador lee el archivo FeatureCollection de OpenStreetMap
                const datosGeoJson = await respuesta.json();
                
                // Transforma el mapa original en un formato limpio para las tarjetas en tiempo real
                lugaresActuales = datosGeoJson.features.map(feature => {
                    const prop = feature.properties;
                    const coords = feature.geometry.coordinates; // [longitud, latitud]

                    // Unificar los textos de la dirección
                    let direccionFinal = prop["addr:street"] || "";
                    if (prop["addr:housenumber"]) direccionFinal += ` ${prop["addr:housenumber"]}`;
                    if (prop["addr:city"]) {
                        direccionFinal += `, ${prop["addr:city"]}`;
                    } else {
                        direccionFinal += `, ${ciudad.charAt(0).toUpperCase() + ciudad.slice(1)}`;
                    }

                    // Traducir las categorías del mapa original
                    let categoria = "Restaurante";
                    if (prop.shop === "bakery" || prop.shop === "pastry") categoria = "Panadería";
                    else if (prop.amenity === "cafe") categoria = "Cafetería";
                    else if (prop.amenity === "fast_food") categoria = "Comida Rápida";
                    else if (prop.cuisine === "pizza") categoria = "Pizzería";
                    else if (prop.cuisine === "burger") categoria = "Hamburguesería";

                    // Generar notas dinámicas leyendo si tiene opciones veganas o sin lactosa
                    let notasArray = [];
                    if (prop["diet:lactose_free"] === "yes") notasArray.push("Sin lactosa");
                    if (prop["diet:vegan"] === "yes" || prop["diet:vegan"] === "only") notasArray.push("Vegano");
                    if (prop["diet:vegetarian"] === "yes" || prop["diet:vegetarian"] === "only") notasArray.push("Vegetariano");
                    if (prop.takeaway === "only") notasArray.push("Solo para llevar");
                    
                    let notaFinal = notasArray.length > 0 
                        ? `Opciones: ${notasArray.join(", ")}.` 
                        : "Opciones sin gluten verificadas.";

                    return {
                        nombre: prop.name || "Establecimiento",
                        categoria: categoria,
                        direccion: direccionFinal,
                        nota: notaFinal,
                        lat: coords[1], // Latitud
                        lon: coords[0]  // Longitud
                    };
                });

                // Activar el buscador y mostrar resultados
                panelBusqueda.classList.remove('opacity-40', 'pointer-events-none');
                tituloResultados.classList.remove('hidden');

                mensajeEstado.className = "text-center py-4 px-6 text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl mb-8 font-semibold shadow-sm";
                mensajeEstado.innerHTML = `🎉 Se han cargado <b>${lugaresActuales.length} locales</b> en <b>${ciudad.toUpperCase()}</b> de forma automática.`;

                mostrarLugares(lugaresActuales);

            } catch (error) {
                mensajeEstado.className = "text-center py-4 px-6 text-red-800 bg-red-50 border border-red-200 rounded-xl mb-8 font-semibold";
                mensajeEstado.innerHTML = `❌ <b>Error automático:</b> No se pudo leer el archivo de GitHub. Comprueba que las variables <code class="bg-white px-1 py-0.5 rounded text-xs">GITHUB_USER</code> y <code class="bg-white px-1 py-0.5 rounded text-xs">GITHUB_REPO</code> coincidan exactamente con tu repositorio público.`;
                console.error(error);
            }
        }
