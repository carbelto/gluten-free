<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Sin Gluten - Bélgica</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen antialiased">

    <!-- Encabezado Principal -->
    <header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white py-10 shadow-lg text-center">
        <h1 class="text-4xl font-extrabold tracking-wide drop-shadow-xs">🇧🇪 Guía Sin Gluten</h1>
        <p class="text-emerald-100 mt-2 text-lg">Tu comida segura en Bruselas, Gante y Brujas</p>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8">
        
        <!-- Panel de Control Principal -->
        <div class="bg-white rounded-2xl shadow-md p-6 mb-8 border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Selector de Ciudad -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                <label class="block text-sm font-bold text-emerald-700 uppercase tracking-wider mb-2">
                    📍 Elige una Ciudad:
                </label>
                <select id="selectorCiudad" onchange="cambiarCiudad()" class="w-full p-3 bg-white border border-gray-300 rounded-lg font-medium shadow-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none cursor-pointer transition-all">
                    <option value="" disabled selected>Selecciona tu destino...</option>
                    <option value="bruselas">Bruselas</option>
                    <option value="gante">Gante</option>
                    <option value="brujas">Brujas</option>
                </select>
            </div>

            <!-- Buscador en Tiempo Real -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                <label class="block text-sm font-bold text-gray-600 uppercase tracking-wider mb-2">
                    🔍 Filtrar por nombre o tipo:
                </label>
                <input type="text" id="buscador" oninput="filtrarLugares()" placeholder="Ej. Pizza, Panadería, Domino's..." class="w-full p-2.5 bg-white border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none placeholder-gray-400">
            </div>

        </div>

        <!-- BARRA DE ESTADO -->
        <div id="mensajeEstado" class="text-center py-4 px-6 text-gray-600 bg-amber-50 border border-amber-200 rounded-xl mb-8 font-medium shadow-sm transition-all">
            💡 Selecciona una ciudad en el menú desplegable para ver sus lugares sin gluten automáticamente.
        </div>

        <!-- CONTENEDOR DE TARJETAS (Resultados) -->
        <div class="mb-4">
            <h2 id="tituloResultados" class="text-2xl font-black text-gray-800 hidden mb-6">
                📍 Sitios sin Gluten Encontrados
            </h2>
            <div id="listaLugares" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

    </main>

    <script>
        // =========================================================================
        // ⚙️ CONFIGURACIÓN DE TU REPOSITORIO DE GITHUB
        // Configura tus datos reales para enlazar las descargas automáticas
        // =========================================================================
        const GITHUB_USER = "carbelto"; 
        const GITHUB_REPO = "gluten-free";
        const GITHUB_BRANCH = "main"; // Cambia a "master" si tu rama principal se llama así
        // =========================================================================

        let lugaresActuales = [];

        // Descarga el JSON real de tu GitHub de forma automática al pulsar la ciudad
        async function cambiarCiudad() {
            const ciudad = document.getElementById('selectorCiudad').value;
            const mensajeEstado = document.getElementById('mensajeEstado');
            const tituloResultados = document.getElementById('tituloResultados');
            const buscador = document.getElementById('buscador');
            const contenedor = document.getElementById('listaLugares');

            // Limpiar interfaz
            buscador.value = '';
            contenedor.innerHTML = '';
            tituloResultados.classList.add('hidden');

            // Estado visual transitorio de carga
            mensajeEstado.className = "text-center py-4 px-6 text-blue-800 bg-blue-50 border border-blue-200 rounded-xl mb-8 font-semibold animate-pulse";
            mensajeEstado.innerHTML = `⏳ Descargando de tu repositorio los locales de <b>${ciudad.toUpperCase()}</b>...`;

            // Enlace directo al formato Raw del archivo público en GitHub
            const urlJson = `https://githubusercontent.com{GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/lugares_${ciudad}.json`;

            try {
                const respuesta = await fetch(urlJson);
                
                if (!respuesta.ok) {
                    throw new Error(`Error HTTP: ${respuesta.status}`);
                }

                // El navegador lee el archivo GeoJSON puro exportado de Overpass-Turbo
                const datosGeoJson = await respuesta.json();
                
                // Mapeo nativo de la estructura real del archivo (features -> properties)
                lugaresActuales = datosGeoJson.features.map(feature => {
                    const prop = feature.properties;
                    const coords = feature.geometry.coordinates; // Formato original: [longitud, latitud]

                    // Construcción automática de la dirección
                    let calle = prop["addr:street"] || "";
                    let numero = prop["addr:housenumber"] || "";
                    let direccionFinal = calle;
                    if (numero) direccionFinal += ` ${numero}`;
                    if (prop["addr:city"]) {
                        direccionFinal += `, ${prop["addr:city"]}`;
                    } else {
                        // En su defecto, añade la ciudad seleccionada con la primera letra en mayúscula
                        direccionFinal += `, ${ciudad.charAt(0).toUpperCase() + ciudad.slice(1)}`;
                    }

                    // Traducción automática de tipos de establecimiento de OpenStreetMap
                    let categoria = "Restaurante";
                    if (prop.shop === "bakery" || prop.shop === "pastry") categoria = "Panadería";
                    else if (prop.amenity === "cafe") categoria = "Cafetería";
                    else if (prop.amenity === "fast_food") categoria = "Comida Rápida";
                    else if (prop.cuisine === "pizza") categoria = "Pizzería";
                    else if (prop.cuisine === "burger") categoria = "Hamburguesería";

                    // Extracción de etiquetas para la caja de notas adicionales
                    let opcionesAdicionales = [];
                    if (prop["diet:lactose_free"] === "yes") opcionesAdicionales.push("Sin lactosa");
                    if (prop["diet:vegan"] === "yes" || prop["diet:vegan"] === "only") opcionesAdicionales.push("Vegano");
                    if (prop["diet:vegetarian"] === "yes" || prop["diet:vegetarian"] === "only") opcionesAdicionales.push("Vegetariano");
                    if (prop.takeaway === "only") opcionesAdicionales.push("Solo para llevar");
                    
                    let notaFinal = opcionesAdicionales.length > 0 
                        ? `Opciones detectadas: ${opcionesAdicionales.join(", ")}.` 
                        : "Establecimiento con opciones sin gluten verificadas.";

                    return {
                        nombre: prop.name || "Establecimiento",
                        categoria: categoria,
                        direccion: direccionFinal,
                        nota: notaFinal,
                        lat: coords[1], // Latitud (segundo elemento del par)
                        lon: coords[0]  // Longitud (primer elemento del par)
                    };
                });

                // Mostrar interfaz completa
                tituloResultados.classList.remove('hidden');
                mensajeEstado.className = "text-center py-4 px-6 text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl mb-8 font-semibold shadow-sm";
                mensajeEstado.innerHTML = `🎉 ¡Conexión con GitHub exitosa! Mostrando <b>${lugaresActuales.length} locales</b> en <b>${ciudad.toUpperCase()}</b>.`;

                mostrarLugares(lugaresActuales);

            } catch (error) {
                mensajeEstado.className = "text-center py-4 px-6 text-red-800 bg-red-50 border border-red-200 rounded-xl mb-8 font-semibold";
                mensajeEstado.innerHTML = `❌ <b>Error automático:</b> No se ha podido leer tu archivo de GitHub. Comprueba que tu repositorio sea <b>Público</b> y que hayas escrito correctamente tu usuario y repositorio en el script.`;
                console.error("Detalle del error:", error);
            }
        }

        // Renderiza de forma dinámica las tarjetas de los restaurantes
        function mostrarLugares(lugares) {
            const contenedor = document.getElementById('listaLugares');
            contenedor.innerHTML = '';

            if (lugares.length === 0) {
                contenedor.innerHTML = `<p class="col-span-full text-center text-gray-400 py-12 font-medium">🔍 No hay ningún local que coincida con tu búsqueda.</p>`;
                return;
            }

            lugares.forEach(lugar => {
                // Al usar las coordenadas exactas de latitud y longitud, el enlace a Maps es infalible
                const urlMaps = `https://google.com{lugar.lat},${lugar.lon}`;

                const tarjeta = `
