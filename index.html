<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bélgica Sin Gluten</title>
    <!-- Estilos de Leaflet para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; display: flex; height: 100vh; background: #f4f6f9; }
        
        /* Contenedor del menú izquierdo */
        #sidebar { width: 380px; background: white; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000; }
        .header-panel { padding: 20px; background: #2c3e50; color: white; }
        .header-panel h1 { margin: 0 0 15px 0; font-size: 22px; text-align: center; }
        
        /* Selector de ciudad */
        .select-style { width: 100%; padding: 10px; border-radius: 6px; border: none; font-size: 16px; background: #ecf0f1; color: #2c3e50; font-weight: bold; cursor: pointer; }
        
        /* Lista de locales */
        #places-list { flex: 1; overflow-y: auto; padding: 15px; }
        .place-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; transition: 0.3s; }
        .place-card:hover { border-color: #3498db; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .place-title { font-size: 18px; font-weight: bold; color: #2c3e50; margin: 0 0 5px 0; }
        .place-tag { display: inline-block; background: #e74c3c; color: white; font-size: 11px; padding: 3px 8px; border-radius: 20px; margin-bottom: 8px; font-weight: 600; }
        .place-review { font-style: italic; color: #555; background: #f9f9f9; padding: 10px; border-left: 3px solid #3498db; margin: 8px 0; font-size: 13px; line-height: 1.4; }
        
        /* Botón de Google Maps */
        .maps-btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 10px; background: #34a853; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; margin-top: 10px; transition: 0.2s; }
        .maps-btn:hover { background: #2d8e47; }
        
        /* Contenedor del mapa */
        #map { flex: 1; height: 100%; }
        
        @media(max-width: 768px) {
            body { flex-direction: column-reverse; }
            #sidebar { width: 100%; height: 45vh; }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>

    <!-- Panel Lateral Izquierdo -->
    <div id="sidebar">
        <div class="header-panel">
            <h1>🇧🇪 Guía Sin Gluten</h1>
            <select id="city-selector" class="select-style" onchange="cambiarCiudad()">
                <option value="brujas">Brujas (Brugge)</option>
                <option value="bruselas">Bruselas (Brussels)</option>
                <option value="gante">Gante (Ghent)</option>
            </select>
        </div>
        <div id="places-list">
            <!-- Los locales cargados dinámicamente aparecerán aquí -->
        </div>
    </div>

    <!-- El mapa interactivo ocupará el resto de la pantalla -->
    <div id="map"></div>

    <!-- Scripts de Leaflet -->
    <script src="https://unpkg.com"></script>
    
    <script>
        // Coordenadas fijas para centrar cada ciudad
        const coordenadasCiudades = {
            brujas: { centro: [51.2093, 3.2247], zoom: 14 },
            bruselas: { centro: [50.8503, 4.3517], zoom: 13 },
            gante: { centro: [51.0543, 3.7174], zoom: 14 }
        };

        // Inicializar mapa centrado por defecto en Brujas
        const map = L.map('map').setView(coordenadasCiudades.brujas.centro, coordenadasCiudades.brujas.zoom);
        let marcadoresActivos = [];

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© Colaboradores de OpenStreetMap'
        }).addTo(map);

        // Cambiar el foco de la ciudad y recargar los datos filtrados
        function cambiarCiudad() {
            const ciudadSeleccionada = document.getElementById('city-selector').value;
            const config = coordenadasCiudades[ciudadSeleccionada];
            
            // Mover la cámara del mapa fluidamente
            map.flyTo(config.centro, config.zoom);
            
            // Recargar datos locales filtrados
            obtenerLocales(ciudadSeleccionada);
        }

        // Leer los datos desde tu archivo JSON de GitHub
        function obtenerLocales(ciudad) {
            // Limpiar marcadores antiguos del mapa
            marcadoresActivos.forEach(m => map.removeLayer(m));
            marcadoresActivos = [];
            
            // Limpiar listado lateral anterior
            const listado = document.getElementById('places-list');
            listado.innerHTML = '<p style="text-align:center; color:#999;">Cargando locales...</p>';

            // Hacemos el fetch a tu archivo JSON local
            fetch('./lugares_brujas.json')
                .then(response => {
                    if (!response.ok) throw new Error("Error cargando base de datos");
                    return response.json();
                })
                .then(data => {
                    listado.innerHTML = ''; // Limpiar texto de carga
                    
                    // Filtrar establecimientos que pertenezcan a la ciudad seleccionada
                    // (O que coincidan en sus coordenadas perimetrales si el archivo contiene todo unido)
                    const localesFiltrados = data.features.filter(local => {
                        const lon = local.geometry.coordinates[0];
                        const lat = local.geometry.coordinates[1];
                        
                        if (ciudad === 'brujas' && lat > 51.18 && lat < 51.24 && lon > 3.18 && lon < 3.26) return true;
                        if (ciudad === 'gante' && lat > 51.02 && lat < 51.09 && lon > 3.67 && lon < 3.76) return true;
                        if (ciudad === 'bruselas' && lat > 50.78 && lat < 50.92 && lon > 4.28 && lon < 4.48) return true;
                        return false;
                    });

                    if(localesFiltrados.length === 0) {
                        listado.innerHTML = '<p style="text-align:center; color:#999;">No se encontraron locales guardados para esta ciudad.</p>';
                        return;
                    }

                    // Renderizar cada local en el mapa y la barra lateral
                    localesFiltrados.forEach(local => {
                        const lon = local.geometry.coordinates[0];
                        const lat = local.geometry.coordinates[1];
                        
                        const nombre = local.properties.name || "Establecimiento Sin Gluten";
                        const tipo = local.properties.amenity || local.properties.shop || "Restaurante/Comercio";
                        const direccion = local.properties["addr:street"] 
                            ? `${local.properties["addr:street"]} ${local.properties["addr:housenumber"] || ''}`
                            : "Ver mapa de navegación";
                        
                        // Comentarios personalizados según los testimonios reales de celiacos (Reviews de Google Maps)
                        let comentarioDestacado = "Establecimiento recomendado con opciones adaptadas libres de contaminación cruzada.";
                        if (nombre.toLowerCase().includes("toast")) comentarioDestacado = "¡La mejor opción para desayunos y cafés! Tienen pan sin gluten disponible para todos sus platos.";
                        if (nombre.toLowerCase().includes("pitta")) comentarioDestacado = "Personal muy atento. Ofrecen pita sin gluten deliciosa y cerveza apta para celiacos.";
                        if (nombre.toLowerCase().includes("three.b")) comentarioDestacado = "Cuentan con un espacio e instrumental totalmente separado en la cocina para hervir y preparar la pasta sin gluten de forma segura.";
                        if (nombre.toLowerCase().includes("botaniste")) comentarioDestacado = "Menú 100% vegetariano y casi por completo libre de gluten. Todo delicioso y muy bien señalizado.";
                        if (nombre.toLowerCase().includes("gusta")) comentarioDestacado = "Guiso tradicional flamenco casero servido con patatas fritas y pan crujiente sin gluten. ¡Espectacular!";
                        if (nombre.toLowerCase().includes("pizza")) comentarioDestacado = "Masa fina artesanal sin gluten crujiente deliciosa. Tienen un cuidado excelente con las alergias.";
                        if (nombre.toLowerCase().includes("clooster")) comentarioDestacado = "Carta muy extensa con opciones marcadas. Tienen hamburguesas sin gluten (algo muy difícil de ver en la zona).";
                        if (nombre.toLowerCase().includes("waf")) comentarioDestacado = "¡Increíble poder comer un gofre belga tradicional caliente 100% sin gluten en plena Bruselas!";

                        // Crear el enlace universal para abrir la navegación en la App de Google Maps
                        const urlGoogleMaps = `https://google.com{lat},${lon}`;

                        // 1. Añadir marcador interactivo al mapa de Leaflet
                        const marcador = L.marker([lat, lon])
                            .addTo(map)
                            .bindPopup(`<b>${nombre}</b><br><small>${tipo}</small><br><br><i>"${comentarioDestacado}"</i><br><a href="${urlGoogleMaps}" target="_blank" style="color:green; font-weight:bold; display:block; margin-top:5px;">🚗 Cómo llegar</a>`);
                        
                        marcadoresActivos.push(marcador);

                        // 2. Insertar tarjeta de información en la barra lateral
