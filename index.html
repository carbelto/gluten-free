<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador Sin Gluten</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
    --accent: #059669; --accent-dark: #047857; --accent-soft: #d1fae5; --border: #e5e7eb;
    --star: #f2a900; --warn-bg: #fffbeb; --warn-text: #92400e; --error-bg: #fef2f2; --error-text: #991b1b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181a; --card: #1d2326; --text: #e8ece9; --muted: #98a39c;
      --accent: #10b981; --accent-dark: #34d399; --accent-soft: #1f3328; --border: #2d3639;
      --warn-bg: #2b2412; --warn-text: #f3c77a; --error-bg: #34191a; --error-text: #fca5a5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); }
  header { background: linear-gradient(to right, #059669, #0d9488); color: #fff; padding: 20px 16px 16px; }
  header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
  header p { margin: 4px 0 12px; color: #ccfbf1; font-size: .95rem; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text], select { font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
  input[type=text]:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(16,185,129,.25); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px;
    background: #f97316; color: #fff; font-weight: 700; }
  button:hover { background: #ea580c; }
  button.secondary { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
  button.secondary:hover { background: var(--accent-soft); filter: brightness(.96); }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .chips button { background: rgba(255,255,255,.2); color: #fff; padding: 9px 22px; font-size: 1rem;
    font-weight: 700; border-radius: 99px; }
  .chips button:hover { background: rgba(255,255,255,.32); }
  .chips button.active { background: #fff; color: #047857; }
  .filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px;
    background: var(--card); border-bottom: 1px solid var(--border); font-size: .9rem; color: var(--muted); }
  .filters input[type=text] { padding: 6px 10px; }
  main { display: grid; grid-template-columns: minmax(300px, 440px) 1fr; height: calc(100vh - 205px); min-height: 420px; }
  #list { overflow-y: auto; padding: 12px; }
  #map { height: 100%; min-height: 300px; }
  #status { padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; font-size: .9rem;
    background: var(--warn-bg); color: var(--warn-text); }
  #status.ok { background: var(--accent-soft); color: var(--accent-dark); }
  #status.error { background: var(--error-bg); color: var(--error-text); }
  #status.loading { background: #eff6ff; color: #1e40af; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .card:hover { border-color: var(--accent); box-shadow: 0 6px 12px -4px rgba(0,0,0,.12); transform: translateY(-1px); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card h2 { font-size: 1.05rem; margin: 0; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 4px; line-height: 1.4; }
  .badge { background: var(--accent-soft); color: var(--accent-dark); font-size: .7rem; font-weight: 700;
    padding: 3px 9px; border-radius: 6px; text-transform: uppercase; white-space: nowrap; border: 1px solid transparent; }
  .badge.only { background: var(--accent); color: #fff; }
  .rating { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: .9rem; }
  .stars { color: var(--star); letter-spacing: 1px; }
  .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions button { font-size: .8rem; padding: 5px 12px; }
  .actions a { color: var(--accent-dark); font-size: .8rem; font-weight: 600; text-decoration: none; }
  .actions a:hover { text-decoration: underline; }
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--card);
    color: var(--text); width: min(480px, 92vw); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .starpick { font-size: 2rem; color: var(--star); cursor: pointer; user-select: none; }
  textarea { width: 100%; min-height: 80px; margin: 8px 0; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
  .comment { border-top: 1px solid var(--border); padding: 8px 0; font-size: .9rem; }
  .notice { font-size: .8rem; color: var(--muted); margin-top: 8px; }
  footer { font-size: .75rem; color: var(--muted); padding: 8px 16px 16px; text-align: center; }
  footer a { color: var(--accent-dark); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    #map { height: 320px; order: -1; }
  }
</style>
</head>
<body>
<header>
  <h1>🌾 Buscador Sin Gluten</h1>
  <p>Locales con opciones sin gluten en Bélgica, valorados por usuarios</p>
  <div class="chips" role="group" aria-label="Elige una ciudad">
    <button type="button" data-city="brujas">Brujas</button>
    <button type="button" data-city="bruselas">Bruselas</button>
    <button type="button" data-city="gante">Gante</button>
  </div>
</header>

<div class="filters">
  <label><input type="checkbox" id="onlyFilter"> Solo 100 % sin gluten</label>
  <label>Ordenar:
    <select id="sortSelect">
      <option value="rating">Mejor valorados</option>
      <option value="name">Nombre (A-Z)</option>
    </select>
  </label>
  <input type="text" id="textFilter" placeholder="Filtrar: pizza, panadería, Domino's…">
</div>

<main>
  <section id="list"><div id="status">👆 Elige una ciudad: Brujas, Bruselas o Gante.</div><div id="cards"></div></section>
  <div id="map"></div>
</main>
<footer>
  Datos de lugares © colaboradores de <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> (licencia ODbL).
  Las etiquetas de OSM no están verificadas: si tienes celiaquía, confirma siempre con el local.
</footer>

<dialog id="rateDialog">
  <h3 id="rateTitle" style="margin-top:0"></h3>
  <div id="starPick" class="starpick" aria-label="Puntuación"></div>
  <textarea id="rateComment" maxlength="500" placeholder="Comentario (opcional): ¿tenían cocina separada, menú sin gluten, buena atención?"></textarea>
  <div style="display:flex; gap:8px; justify-content:flex-end">
    <button type="button" class="secondary" id="rateCancel">Cancelar</button>
    <button type="button" id="rateSave">Guardar valoración</button>
  </div>
  <div id="commentList"></div>
  <div class="notice" id="storageNotice"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>window.L || document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
<script>
/* ============================ CONFIG ============================
   Valoraciones compartidas: rellena estos dos valores con los de tu proyecto
   gratuito de Supabase (ver README.md). Si los dejas vacíos, las valoraciones
   se guardan solo en este navegador (modo prueba). */
const CONFIG = {
  SUPABASE_URL: "",       // p. ej. "https://abcd1234.supabase.co"
  SUPABASE_ANON_KEY: ""   // clave "anon public"
};

/* Ciudades disponibles. "query" es lo que se geocodifica si no hay archivo
   precargado (se añade el país para evitar confusiones con otros lugares). */
const CITIES = {
  brujas:   { label: "Brujas",   query: "Brugge, Bélgica" },
  bruselas: { label: "Bruselas", query: "Bruxelles, Bélgica" },
  gante:    { label: "Gante",    query: "Gent, Bélgica" }
};

/* Ciudades precargadas (opcional): si junto a index.html existe un archivo
   lugares_brujas.json, lugares_bruselas.json o lugares_gante.json (GeoJSON de
   OSM o lista simple), se usa en lugar de consultar OpenStreetMap en directo. */
const PRELOADED_PREFIX = "lugares_";

const OVERPASS_URLS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter"
];
const NOMINATIM_URL = "https://nominatim.openstreetmap.org/search";
const PHOTON_URL = "https://photon.komoot.io/api/";

const FOOD_AMENITIES = ["restaurant", "cafe", "bar", "pub", "fast_food", "ice_cream", "biergarten"];
const FOOD_SHOPS = ["bakery", "pastry", "confectionery"];

/* ============================ UTILIDADES ============================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function setStatus(html, kind) {
  const el = $("status");
  el.className = kind || "";
  el.innerHTML = html;
}

function starsText(n) {
  const full = Math.round(n);
  return "★".repeat(full) + "☆".repeat(5 - full);
}

/* Media bayesiana: un único 5★ no supera a un sitio con muchas reseñas de 4,8. */
function rankScore(avg, count) {
  const m = 3, prior = 3.5;
  return (count / (count + m)) * (avg || 0) + (m / (count + m)) * prior;
}

function slugify(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function capitalizar(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

/* ============================ DATOS: NORMALIZACIÓN ============================ */
/* Devuelve [lon, lat]. Los nodos son un punto; los edificios (way/relation)
   vienen como Polygon/MultiPolygon, así que se usa el centro del contorno. */
function centro(g) {
  if (!g || !g.coordinates) return [null, null];
  if (g.type === "Point") return [g.coordinates[0], g.coordinates[1]];
  const pts = [];
  (function recoger(a) {
    if (!Array.isArray(a)) return;
    if (typeof a[0] === "number") pts.push(a); else a.forEach(recoger);
  })(g.coordinates);
  if (!pts.length) return [null, null];
  return [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
}

function categoria(t) {
  const cocinas = String(t.cuisine || "").split(";").map((c) => c.trim());
  if (t.shop === "bakery" || t.shop === "pastry") return "Panadería";
  if (t.shop === "confectionery") return "Confitería";
  if (t.amenity === "cafe") return "Cafetería";
  if (t.amenity === "bar" || t.amenity === "pub" || t.amenity === "biergarten") return "Bar";
  if (t.amenity === "ice_cream") return "Heladería";
  if (cocinas.includes("pizza")) return "Pizzería";
  if (cocinas.includes("burger")) return "Hamburguesería";
  if (t.amenity === "fast_food") return "Comida rápida";
  return "Restaurante";
}

/* Construye un lugar a partir de las etiquetas de OSM. */
function buildPlace(t, lat, lon, osmId) {
  if (!t || !t.name) return null;
  const hasCoords = lat != null && lon != null && isFinite(lat) && isFinite(lon);
  const street = [t["addr:street"], t["addr:housenumber"]].filter(Boolean).join(" ");
  const extras = [];
  if (t["diet:lactose_free"] === "yes") extras.push("Sin lactosa");
  if (t["diet:vegan"] === "yes" || t["diet:vegan"] === "only") extras.push("Vegano");
  if (t["diet:vegetarian"] === "yes" || t["diet:vegetarian"] === "only") extras.push("Vegetariano");
  if (t.takeaway === "only") extras.push("Solo para llevar");
  const isOsmId = /^(node|way|relation)\/\d+$/.test(osmId || "");
  return {
    id: isOsmId ? osmId : (hasCoords ? `geo/${lat.toFixed(5)}_${lon.toFixed(5)}` : `nombre/${slugify(t.name)}`),
    osm: isOsmId ? osmId : "",
    name: t.name,
    kind: categoria(t),
    cuisine: t.cuisine ? t.cuisine.split(";").map((c) => c.replace(/_/g, " ")).join(", ") : "",
    only: t["diet:gluten_free"] === "only",
    extras,
    address: [street, t["addr:city"]].filter(Boolean).join(", "),
    website: t.website || t["contact:website"] || "",
    phone: t.phone || t["contact:phone"] || "",
    hours: t.opening_hours || "",
    lat: hasCoords ? Number(lat) : null,
    lon: hasCoords ? Number(lon) : null
  };
}

/* Archivo precargado: GeoJSON de OSM (con .features) o lista simple
   [{nombre, categoria, direccion, lat, lon}]. */
function normalizarPrecargado(datos) {
  let out = [];
  if (datos && Array.isArray(datos.features)) {
    out = datos.features.map((f) => {
      const [lon, lat] = centro(f.geometry);
      return buildPlace(f.properties || {}, lat, lon, f.id || (f.properties && f.properties["@id"]));
    });
  } else if (Array.isArray(datos)) {
    out = datos.map((it) => {
      const p = buildPlace({ name: it.nombre || it.name, cuisine: it.cuisine }, it.lat, it.lon, null);
      if (p) {
        p.kind = it.categoria || p.kind;
        p.address = it.direccion || "";
      }
      return p;
    });
  }
  return out.filter(Boolean);
}

/* ============================ VALORACIONES ============================ */
const useSupabase = Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

const sbHeaders = () => ({
  apikey: CONFIG.SUPABASE_ANON_KEY,
  Authorization: "Bearer " + CONFIG.SUPABASE_ANON_KEY,
  "Content-Type": "application/json"
});

function lsGet() { try { return JSON.parse(localStorage.getItem("gf_ratings") || "{}"); } catch (e) { return {}; } }
function lsSet(v) { try { localStorage.setItem("gf_ratings", JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }

const Ratings = {
  /* Devuelve { id: {avg, count} } para una lista de ids */
  async summary(ids) {
    const out = {};
    if (!ids.length) return out;
    if (useSupabase) {
      for (let i = 0; i < ids.length; i += 100) {
        const list = ids.slice(i, i + 100).map((x) => `"${x}"`).join(",");
        const url = `${CONFIG.SUPABASE_URL}/rest/v1/ratings?select=osm_id,stars&osm_id=in.(${encodeURIComponent(list)})`;
        const res = await fetch(url, { headers: sbHeaders() });
        if (!res.ok) throw new Error("Supabase " + res.status);
        for (const r of await res.json()) {
          const o = (out[r.osm_id] ||= { sum: 0, count: 0 });
          o.sum += r.stars; o.count += 1;
        }
      }
    } else {
      const all = lsGet();
      for (const id of ids) {
        const arr = all[id] || [];
        if (arr.length) out[id] = { sum: arr.reduce((a, r) => a + r.stars, 0), count: arr.length };
      }
    }
    for (const k in out) out[k] = { avg: out[k].sum / out[k].count, count: out[k].count };
    return out;
  },

  async comments(id) {
    if (useSupabase) {
      const url = `${CONFIG.SUPABASE_URL}/rest/v1/ratings?select=stars,comment,created_at&osm_id=eq.${encodeURIComponent(id)}&order=created_at.desc&limit=20`;
      const res = await fetch(url, { headers: sbHeaders() });
      if (!res.ok) throw new Error("Supabase " + res.status);
      return res.json();
    }
    return (lsGet()[id] || []).slice().reverse().map((r) => ({ stars: r.stars, comment: r.comment, created_at: r.ts }));
  },

  async add(id, stars, comment) {
    if (useSupabase) {
      const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/ratings`, {
        method: "POST",
        headers: { ...sbHeaders(), Prefer: "return=minimal" },
        body: JSON.stringify({ osm_id: id, stars, comment: comment || null })
      });
      if (!res.ok) throw new Error("Supabase " + res.status);
    } else {
      const all = lsGet();
      (all[id] ||= []).push({ stars, comment, ts: new Date().toISOString() });
      lsSet(all);
    }
  }
};

/* ============================ MAPA ============================ */
if (typeof L === "undefined") {
  setStatus("⚠️ No se pudo cargar el mapa (Leaflet). Revisa tu conexión o tu bloqueador de contenido y recarga la página.", "error");
  throw new Error("Leaflet no cargó");
}
const map = L.map("map").setView([50.6, 4.4], 7);
/* Teselas oficiales de OSM: funcionan al servir la web por http(s) (GitHub Pages,
   localhost); abrir el archivo con doble clic las bloquea (403). */
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const markerLayer = L.layerGroup().addTo(map);
const markers = {};

/* ============================ BÚSQUEDA ============================ */
let places = [];       // lugares de la ciudad actual
let summaries = {};    // valoraciones por id
let areaName = "";     // nombre de la zona buscada
let sourceLabel = "";  // de dónde salen los datos

/* Nominatim primero; si falla (p. ej. 403 por abrir el archivo como file://),
   se prueba con Photon, también basado en OSM. Ambos devuelven el mismo formato. */
async function geocodeNominatim(city) {
  const url = `${NOMINATIM_URL}?q=${encodeURIComponent(city)}&format=json&limit=1&accept-language=es`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Nominatim " + res.status);
  return (await res.json())[0] || null;
}

async function geocodePhoton(city) {
  const res = await fetch(`${PHOTON_URL}?q=${encodeURIComponent(city)}&limit=1&lang=es`);
  if (!res.ok) throw new Error("Photon " + res.status);
  const f = (await res.json()).features?.[0];
  if (!f) return null;
  const p = f.properties, [lon, lat] = f.geometry.coordinates;
  const [w, n, e, s] = p.extent || [lon, lat, lon, lat];
  return {
    osm_type: { R: "relation", W: "way", N: "node" }[p.osm_type] || "node",
    osm_id: p.osm_id, boundingbox: [s, n, w, e], lat, lon, display_name: p.name || city
  };
}

async function geocode(city) {
  const failed = [];
  for (const fn of [geocodeNominatim, geocodePhoton]) {
    try { const r = await fn(city); if (r) return r; } catch (e) { failed.push(e.message); }
  }
  if (failed.length === 2) {
    throw new Error("No se pudo localizar la ciudad (" + failed.join("; ") + "). " +
      "Si abres el archivo con doble clic, sírvelo por http (python3 -m http.server) o súbelo a GitHub Pages.");
  }
  throw new Error("No encuentro esa ciudad. Prueba con otro nombre.");
}

function buildQuery(geo) {
  let scope = "", filt;
  if (geo.osm_type === "relation") {
    scope = `area(${3600000000 + Number(geo.osm_id)})->.a;`;
    filt = "(area.a)";
  } else {
    const [s, n, w, e] = geo.boundingbox;
    filt = `(${s},${w},${n},${e})`;
  }
  /* Consulta ligera por la etiqueta (usa el índice de Overpass); el tipo de
     local se filtra después en el navegador. */
  return `[out:json][timeout:25];
${scope}
nwr["diet:gluten_free"~"^(yes|only)$"]${filt};
out center tags;`;
}

async function fetchLive(geo) {
  let json = null, lastErr = "";
  for (let i = 0; i < OVERPASS_URLS.length; i++) {
    setStatus(`⏳ Consultando OpenStreetMap (servidor ${i + 1} de ${OVERPASS_URLS.length})…`, "loading");
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(OVERPASS_URLS[i], {
        method: "POST",
        body: "data=" + encodeURIComponent(buildQuery(geo)),
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        signal: ctrl.signal
      });
      if (!res.ok) { lastErr = "Overpass " + res.status; continue; }
      json = await res.json();
      break;
    } catch (e) {
      lastErr = e.name === "AbortError" ? "Overpass tardó demasiado" : "Overpass sin conexión";
    } finally { clearTimeout(timer); }
  }
  if (!json) throw new Error("Overpass no responde (" + lastErr + "). Inténtalo de nuevo en unos segundos.");
  return json.elements
    .filter((el) => {
      const t = el.tags || {};
      return FOOD_AMENITIES.includes(t.amenity) || FOOD_SHOPS.includes(t.shop);
    })
    .map((el) => buildPlace(el.tags, el.lat ?? el.center?.lat, el.lon ?? el.center?.lon, `${el.type}/${el.id}`))
    .filter(Boolean);
}

async function fetchPreloaded(city) {
  const slug = slugify(city);
  if (!slug) return null;
  try {
    const res = await fetch(`${PRELOADED_PREFIX}${slug}.json`, { cache: "no-cache" });
    if (!res.ok) return null;
    const list = normalizarPrecargado(await res.json());
    return list.length ? list : null;
  } catch (e) { return null; }
}

/* ============================ RENDER ============================ */
function mapsUrl(p) {
  if (p.lat != null && p.lon != null) return `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${p.name} ${p.address || areaName}`);
}

function visiblePlaces() {
  let list = places.slice();
  if ($("onlyFilter").checked) list = list.filter((p) => p.only);
  const q = $("textFilter").value.toLowerCase().trim();
  if (q) {
    list = list.filter((p) => [p.name, p.kind, p.cuisine, p.address].some((v) => (v || "").toLowerCase().includes(q)));
  }
  const score = (p) => {
    const s = summaries[p.id];
    return rankScore(s?.avg, s?.count || 0) + (s ? 0 : -10);
  };
  if ($("sortSelect").value === "rating") {
    list.sort((a, b) => score(b) - score(a) || (b.only - a.only) || a.name.localeCompare(b.name, "es"));
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name, "es"));
  }
  return list;
}

function render() {
  const list = visiblePlaces();
  const cards = $("cards");
  cards.innerHTML = "";
  markerLayer.clearLayers();
  for (const k in markers) delete markers[k];

  list.forEach((p) => {
    const s = summaries[p.id];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head">
        <h2>${esc(p.name)}</h2>
        <span class="badge ${p.only ? "only" : ""}">${p.only ? "100 % sin gluten" : "Con opciones"}</span>
      </div>
      <div class="meta">${esc(p.kind)}${p.cuisine ? " · " + esc(p.cuisine) : ""}${p.extras.length ? " · " + esc(p.extras.join(", ")) : ""}</div>
      ${p.address ? `<div class="meta">📍 ${esc(p.address)}</div>` : ""}
      ${p.hours ? `<div class="meta">🕒 ${esc(p.hours)}</div>` : ""}
      ${p.phone ? `<div class="meta">📞 ${esc(p.phone)}</div>` : ""}
      <div class="rating">
        ${s ? `<span class="stars">${starsText(s.avg)}</span><strong>${s.avg.toFixed(1)}</strong><span class="meta">(${s.count})</span>`
            : `<span class="meta">Aún sin valoraciones</span>`}
      </div>
      <div class="actions">
        <button class="secondary" data-rate="${esc(p.id)}">Valorar</button>
        ${/^https?:\/\//i.test(p.website) ? `<a href="${esc(p.website)}" target="_blank" rel="noopener noreferrer">Web</a>` : ""}
        <a href="${esc(mapsUrl(p))}" target="_blank" rel="noopener noreferrer">Google Maps</a>
        ${p.osm ? `<a href="https://www.openstreetmap.org/${esc(p.osm)}" target="_blank" rel="noopener noreferrer">Ver en OSM</a>` : ""}
      </div>`;
    card.addEventListener("click", (ev) => {
      if (ev.target.closest("button, a") || p.lat == null) return;
      map.flyTo([p.lat, p.lon], 17);
      markers[p.id]?.openPopup();
    });
    cards.appendChild(card);

    if (p.lat != null) {
      const m = L.marker([p.lat, p.lon]).bindPopup(
        `<strong>${esc(p.name)}</strong><br>${s ? starsText(s.avg) + " " + s.avg.toFixed(1) + " (" + s.count + ")" : "Sin valoraciones"}`
      );
      m.addTo(markerLayer);
      markers[p.id] = m;
    }
  });

  cards.querySelectorAll("[data-rate]").forEach((b) =>
    b.addEventListener("click", () => openRate(b.dataset.rate)));

  const withCoords = list.filter((p) => p.lat != null);
  if (withCoords.length) {
    map.fitBounds(L.latLngBounds(withCoords.map((p) => [p.lat, p.lon])).pad(0.15), { maxZoom: 16 });
  }
  setStatus(list.length
    ? `🎉 ${list.length} sitio${list.length === 1 ? "" : "s"} en ${esc(areaName)} ` +
      `(${list.filter((p) => p.only).length} 100 % sin gluten, ${list.filter((p) => summaries[p.id]).length} con valoraciones). ` +
      `<small>Origen: ${esc(sourceLabel)}.</small>`
    : "No hay resultados con estos filtros.", list.length ? "ok" : "");
}

/* ============================ DIÁLOGO DE VALORACIÓN ============================ */
let currentId = null, currentStars = 0;

function paintStars() {
  $("starPick").innerHTML = [1, 2, 3, 4, 5]
    .map((n) => `<span data-s="${n}">${n <= currentStars ? "★" : "☆"}</span>`).join("");
  $("starPick").querySelectorAll("span").forEach((sp) =>
    sp.addEventListener("click", () => { currentStars = Number(sp.dataset.s); paintStars(); }));
}

async function openRate(id) {
  currentId = id; currentStars = 0;
  const p = places.find((x) => x.id === id);
  $("rateTitle").textContent = p ? p.name : "Valorar";
  $("rateComment").value = "";
  $("storageNotice").textContent = useSupabase ? ""
    : "Modo prueba: tu valoración solo se guarda en este navegador. Conecta Supabase para compartirlas (ver README).";
  paintStars();
  $("commentList").innerHTML = "<div class='meta'>Cargando comentarios…</div>";
  $("rateDialog").showModal();
  try {
    const cs = (await Ratings.comments(id)).filter((c) => c.comment);
    $("commentList").innerHTML = cs.length
      ? cs.map((c) => `<div class="comment"><span class="stars">${starsText(c.stars)}</span><br>${esc(c.comment)}</div>`).join("")
      : "";
  } catch (e) {
    $("commentList").innerHTML = "<div class='meta'>No se pudieron cargar los comentarios.</div>";
  }
}

$("rateCancel").addEventListener("click", () => $("rateDialog").close());
$("rateSave").addEventListener("click", async () => {
  if (!currentStars) { alert("Elige de 1 a 5 estrellas."); return; }
  try {
    await Ratings.add(currentId, currentStars, $("rateComment").value.trim());
    $("rateDialog").close();
    summaries = await Ratings.summary(places.map((p) => p.id));
    render();
  } catch (e) {
    alert("No se pudo guardar la valoración: " + e.message);
  }
});

/* ============================ EVENTOS ============================ */
let busquedaActual = 0;   // evita que una búsqueda lenta pise a otra más reciente

async function buscar(key) {
  const city = CITIES[key];
  if (!city) return;
  const turno = ++busquedaActual;
  document.querySelectorAll(".chips button").forEach((b) => b.classList.toggle("active", b.dataset.city === key));
  $("cards").innerHTML = "";
  markerLayer.clearLayers();
  setStatus(`⏳ Buscando sitios en ${city.label}…`, "loading");
  try {
    const pre = await fetchPreloaded(key);
    if (turno !== busquedaActual) return;
    if (pre) {
      places = pre;
      areaName = city.label;
      sourceLabel = "base de datos precargada";
    } else {
      const geo = await geocode(city.query);
      if (turno !== busquedaActual) return;
      areaName = city.label;
      setStatus(`⏳ Ciudad localizada: ${esc(geo.display_name)}. Buscando sitios sin gluten…`, "loading");
      places = await fetchLive(geo);
      if (turno !== busquedaActual) return;
      sourceLabel = "OpenStreetMap en directo";
      if (!places.length) {
        setStatus(`OSM no tiene sitios etiquetados como sin gluten en ${esc(areaName)}. ` +
          `¡Puedes ayudar añadiendo <code>diet:gluten_free</code> en openstreetmap.org!`);
        map.setView([Number(geo.lat), Number(geo.lon)], 12);
        return;
      }
    }
    setStatus(`⏳ ${places.length} sitios encontrados. Cargando valoraciones…`, "loading");
    try { summaries = await Ratings.summary(places.map((p) => p.id)); } catch (e) { summaries = {}; }
    if (turno !== busquedaActual) return;
    render();
  } catch (e) {
    if (turno !== busquedaActual) return;
    places = [];
    setStatus("❌ " + esc(e.message), "error");
  }
}

document.querySelectorAll(".chips button").forEach((b) =>
  b.addEventListener("click", () => buscar(b.dataset.city)));
$("onlyFilter").addEventListener("change", () => places.length && render());
$("sortSelect").addEventListener("change", () => places.length && render());
$("textFilter").addEventListener("input", () => places.length && render());
</script>
