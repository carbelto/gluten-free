<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinGluten Mapa</title>
    <!-- Estilos de Leaflet para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>

    <!-- Contenedor donde se dibuja el mapa -->
    <div id="map"></div>

    <!-- Script de Leaflet -->
    <script src="https://unpkg.com"></script>
    
    <script>
        // 1. Inicializar el mapa centrado (ejemplo: España)
        const map = L.map('map').setView([40.416775, -3.703790], 6);

        // 2. Cargar la capa de diseño de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© Colaboradores de OpenStreetMap'
        }).addTo(map);

        // 3. NUEVA FUNCIÓN: Leer los datos descargados de lugares.json
        function cargarDatosLocales() {
            fetch('./lugares_brujas.json') // Llama a tu archivo local subido a GitHub
                .then(response => {
                    if (!response.ok) {
                        throw new Error("No se pudo cargar el archivo lugares.json");
                    }
                    return response.json();
                })
                .then(data => {
                    // Recorrer cada establecimiento dentro del GeoJSON
                    data.features.forEach(local => {
                        // GeoJSON guarda las coordenadas como [longitud, latitud]
                        const lon = local.geometry.coordinates[0];
                        const lat = local.geometry.coordinates[1];
                        
                        // Extraer datos informativos del local
                        const nombre = local.properties.name || "Establecimiento Sin Gluten";
                        const tipo = local.properties.amenity || local.properties.shop || "Comercio";
                        const direccion = local.properties["addr:street"] || "Dirección no especificada";

                        // 4. Pintar el marcador en el mapa
                        if (lat && lon) {
                            L.marker([lat, lon])
                             .addTo(map)
                             .bindPopup(`<b>${nombre}</b><br>Tipo: ${tipo}<br>${direccion}`);
                        }
                    });
                })
                .catch(error => {
                    console.error("Error al procesar los datos:", error);
                });
        }

        // Ejecutar la carga al abrir la web
        window.onload = cargarDatosLocales;
    </script>
</body>
</html>
