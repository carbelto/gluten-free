<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SinGluten Mapa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
  :root {
    --bg: #fafaf7; --card: #ffffff; --text: #1d2420; --muted: #66706a;
    --accent: #2f7d4f; --accent-soft: #e4f2ea; --border: #e1e4df; --star: #f2a900;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181a; --card: #1d2326; --text: #e8ece9; --muted: #98a39c;
      --accent: #5bbf84; --accent-soft: #1f3328; --border: #2d3639; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); }
  header { padding: 16px; border-bottom: 1px solid var(--border); background: var(--card); }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text], textarea, select { font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
  input[type=text] { flex: 1 1 220px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px;
    background: var(--accent); color: #fff; }
  button.secondary { background: var(--accent-soft); color: var(--accent); }
  .filters { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 10px;
    font-size: .9rem; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; height: calc(100vh - 118px); }
  #list { overflow-y: auto; padding: 12px; }
  #map { height: 100%; min-height: 300px; }
  #status { padding: 10px 4px; color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card h2 { font-size: 1rem; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: .85rem; }
  .badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
  .badge.only { background: var(--accent); color: #fff; }
  .rating { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: .9rem; }
  .stars { color: var(--star); letter-spacing: 1px; }
  .card .actions { margin-top: 8px; display: flex; gap: 8px; }
  .card .actions button, .card .actions a { font-size: .8rem; padding: 5px 10px; }
  .card a.link { color: var(--accent); text-decoration: none; padding: 5px 0; font-size: .8rem; }
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--card);
    color: var(--text); width: min(480px, 92vw); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .starpick { font-size: 2rem; color: var(--star); cursor: pointer; user-select: none; }
  textarea { width: 100%; min-height: 80px; margin: 8px 0; }
  .comment { border-top: 1px solid var(--border); padding: 8px 0; font-size: .9rem; }
  .notice { font-size: .8rem; color: var(--muted); margin-top: 8px; }
  footer { font-size: .75rem; color: var(--muted); padding: 6px 12px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    #map { height: 320px; order: -1; }
    #list { max-height: none; }
  }
</style>
</head>
<body>
<header>
  <h1>🌾 Sitios sin gluten por ciudad</h1>
  <form id="searchForm">
    <input type="text" id="cityInput" placeholder="Escribe una ciudad (p. ej. Valencia)" required>
    <button type="submit">Buscar</button>
  </form>
  <div class="filters">
    <label><input type="checkbox" id="onlyFilter"> Solo 100 % sin gluten</label>
    <label>Ordenar:
      <select id="sortSelect">
        <option value="rating">Mejor valorados</option>
        <option value="name">Nombre (A-Z)</option>
      </select>
    </label>
  </div>
</header>

<main>
  <section id="list"><div id="status">Busca una ciudad para empezar.</div><div id="cards"></div></section>
  <div id="map"></div>
</main>
<footer>
  Datos de lugares © colaboradores de <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> (ODbL).
  Las valoraciones son de los usuarios de esta web.
</footer>

<dialog id="rateDialog">
  <h3 id="rateTitle" style="margin-top:0"></h3>
  <div id="starPick" class="starpick" aria-label="Puntuación"></div>
  <textarea id="rateComment" maxlength="500" placeholder="Comentario (opcional): ¿tenían cocina separada, menú sin gluten, buena atención?"></textarea>
  <div style="display:flex; gap:8px; justify-content:flex-end">
    <button type="button" class="secondary" id="rateCancel">Cancelar</button>
    <button type="button" id="rateSave">Guardar valoración</button>
  </div>
  <div id="commentList"></div>
  <div class="notice" id="storageNotice"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>window.L || document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
<script>
/* ============================ CONFIG ============================
   Valoraciones compartidas: rellena estos dos valores con los de tu proyecto
   gratuito de Supabase (ver README.md). Si los dejas vacíos, las valoraciones
   se guardan solo en este navegador (modo prueba). */
const CONFIG = {
  SUPABASE_URL: "",       // p. ej. "https://abcd1234.supabase.co"
  SUPABASE_ANON_KEY: ""   // clave "anon public"
};

const OVERPASS_URLS = [
  "https://openstreetmap.fr",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter"
];
const NOMINATIM_URL = "https://nominatim.openstreetmap.org/search";
const PHOTON_URL = "https://photon.komoot.io/api/";

const TYPE_LABELS = {
  restaurant: "Restaurante", cafe: "Cafetería", bar: "Bar", pub: "Pub",
  fast_food: "Comida rápida", ice_cream: "Heladería", biergarten: "Cervecería",
  bakery: "Panadería", pastry: "Pastelería", confectionery: "Confitería"
};

/* ============================ UTILIDADES ============================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function starsText(n) {
  const full = Math.round(n);
  return "★".repeat(full) + "☆".repeat(5 - full);
}

/* Puntuación para ordenar: media bayesiana, para que un único 5★ no
   supere a un sitio con muchas reseñas de 4,8. */
function rankScore(avg, count) {
  const m = 3, prior = 3.5;
  return (count / (count + m)) * (avg || 0) + (m / (count + m)) * prior;
}

/* ============================ VALORACIONES ============================ */
const useSupabase = Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

const sbHeaders = () => ({
  apikey: CONFIG.SUPABASE_ANON_KEY,
  Authorization: "Bearer " + CONFIG.SUPABASE_ANON_KEY,
  "Content-Type": "application/json"
});

const Ratings = {
  /* Devuelve { osmId: {avg, count} } para una lista de ids */
  async summary(ids) {
    const out = {};
    if (!ids.length) return out;
    if (useSupabase) {
      for (let i = 0; i < ids.length; i += 100) {
        const chunk = ids.slice(i, i + 100);
        const list = chunk.map((x) => `"${x}"`).join(",");
        const url = `${CONFIG.SUPABASE_URL}/rest/v1/ratings?select=osm_id,stars&osm_id=in.(${encodeURIComponent(list)})`;
        const res = await fetch(url, { headers: sbHeaders() });
        if (!res.ok) throw new Error("Supabase " + res.status);
        for (const r of await res.json()) {
          const o = (out[r.osm_id] ||= { sum: 0, count: 0 });
          o.sum += r.stars; o.count += 1;
        }
      }
    } else {
      const all = JSON.parse(localStorage.getItem("gf_ratings") || "{}");
      for (const id of ids) {
        const arr = all[id] || [];
        if (arr.length) out[id] = { sum: arr.reduce((a, r) => a + r.stars, 0), count: arr.length };
      }
    }
    for (const k in out) out[k] = { avg: out[k].sum / out[k].count, count: out[k].count };
    return out;
  },

  async comments(id) {
    if (useSupabase) {
      const url = `${CONFIG.SUPABASE_URL}/rest/v1/ratings?select=stars,comment,created_at&osm_id=eq.${encodeURIComponent(id)}&order=created_at.desc&limit=20`;
      const res = await fetch(url, { headers: sbHeaders() });
      if (!res.ok) throw new Error("Supabase " + res.status);
      return res.json();
    }
    const all = JSON.parse(localStorage.getItem("gf_ratings") || "{}");
    return (all[id] || []).slice().reverse().map((r) => ({ stars: r.stars, comment: r.comment, created_at: r.ts }));
  },

  async add(id, stars, comment) {
    if (useSupabase) {
      const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/ratings`, {
        method: "POST",
        headers: { ...sbHeaders(), Prefer: "return=minimal" },
        body: JSON.stringify({ osm_id: id, stars, comment: comment || null })
      });
      if (!res.ok) throw new Error("Supabase " + res.status);
    } else {
      const all = JSON.parse(localStorage.getItem("gf_ratings") || "{}");
      (all[id] ||= []).push({ stars, comment, ts: new Date().toISOString() });
      localStorage.setItem("gf_ratings", JSON.stringify(all));
    }
  }
};

/* ============================ MAPA ============================ */
if (typeof L === "undefined") {
  $("status").textContent = "⚠️ No se pudo cargar el mapa (Leaflet). Revisa tu conexión o tu bloqueador de contenido y recarga la página.";
  throw new Error("Leaflet no cargó");
}
const map = L.map("map").setView([40.4, -3.7], 6);
/* Teselas oficiales de OpenStreetMap. Funcionan al servir la web por http(s)
   (GitHub Pages, localhost); abrir el archivo con doble clic las bloquea (403). */
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const markerLayer = L.layerGroup().addTo(map);
const markers = {};

/* ============================ BÚSQUEDA ============================ */
let areaName = "";    // nombre de la zona buscada
let places = [];      // lugares de la ciudad actual
let summaries = {};   // valoraciones por id

/* Geocodificación: Nominatim primero; si responde con error (p. ej. 403 por
   abrir el archivo como file:// sin Referer), se prueba con Photon (también
   basado en OSM, con CORS abierto). Ambos devuelven el mismo formato. */
async function geocodeNominatim(city) {
  const url = `${NOMINATIM_URL}?q=${encodeURIComponent(city)}&format=json&limit=1&accept-language=es`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Nominatim " + res.status);
  const data = await res.json();
  return data[0] || null;
}

async function geocodePhoton(city) {
  const url = `${PHOTON_URL}?q=${encodeURIComponent(city)}&limit=1&lang=es`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Photon " + res.status);
  const f = (await res.json()).features?.[0];
  if (!f) return null;
  const p = f.properties, [lon, lat] = f.geometry.coordinates;
  const [w, n, e, s] = p.extent || [lon, lat, lon, lat];
  return {
    osm_type: { R: "relation", W: "way", N: "node" }[p.osm_type] || "node",
    osm_id: p.osm_id,
    boundingbox: [s, n, w, e],
    lat, lon,
    display_name: p.name || city
  };
}

async function geocode(city) {
  let result = null, failed = [];
  for (const fn of [geocodeNominatim, geocodePhoton]) {
    try { result = await fn(city); if (result) return result; }
    catch (e) { failed.push(e.message); }
  }
  if (failed.length === 2) {
    throw new Error("No se pudo localizar la ciudad (" + failed.join("; ") + "). " +
      "Si abres el archivo con doble clic, sírvelo por http (python3 -m http.server) o súbelo a GitHub Pages.");
  }
  throw new Error("No encuentro esa ciudad. Prueba con otro nombre.");
}

function buildQuery(geo) {
  const types = "restaurant|cafe|bar|pub|fast_food|ice_cream|biergarten";
  const shops = "bakery|pastry|confectionery";
  let scope;
  if (geo.osm_type === "relation") {
    scope = `area(${3600000000 + Number(geo.osm_id)})->.a;`;
    var filt = "(area.a)";
  } else {
    const [s, n, w, e] = geo.boundingbox;
    scope = "";
    var filt = `(${s},${w},${n},${e})`;
  }
  /* Consulta ligera: solo por la etiqueta diet:gluten_free (usa el índice de
     Overpass). El tipo de local se filtra después en el navegador. */
  return `[out:json][timeout:25];
${scope}
nwr["diet:gluten_free"~"^(yes|only)$"]${filt};
out center tags;`;
}

async function fetchPlaces(geo) {
  let json = null, lastErr = "";
  for (let i = 0; i < OVERPASS_URLS.length; i++) {
    $("status").textContent = `Consultando OpenStreetMap (servidor ${i + 1} de ${OVERPASS_URLS.length})…`;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(OVERPASS_URLS[i], {
        method: "POST",
        body: "data=" + encodeURIComponent(buildQuery(geo)),
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        signal: ctrl.signal
      });
      if (!res.ok) { lastErr = "Overpass " + res.status; continue; }
      json = await res.json();
      break;
    } catch (e) {
      lastErr = e.name === "AbortError" ? "Overpass tardó demasiado" : "Overpass sin conexión";
    } finally { clearTimeout(timer); }
  }
  if (!json) throw new Error("Overpass no responde (" + lastErr + "). Inténtalo de nuevo en unos segundos.");
  return json.elements
    .map((el) => {
      const t = el.tags || {};
      const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
      if (!t.name || lat == null) return null;
      const kind = TYPE_LABELS[t.amenity] ? t.amenity : t.shop;
      if (!TYPE_LABELS[kind]) return null;
      const street = [t["addr:street"], t["addr:housenumber"]].filter(Boolean).join(" ");
      return {
        id: `${el.type}/${el.id}`,
        name: t.name,
        kind: TYPE_LABELS[kind] || kind,
        cuisine: t.cuisine ? t.cuisine.split(";").map((c) => c.replace(/_/g, " ")).join(", ") : "",
        only: t["diet:gluten_free"] === "only",
        address: [street, t["addr:city"]].filter(Boolean).join(", "),
        website: t.website || t["contact:website"] || "",
        phone: t.phone || t["contact:phone"] || "",
        hours: t.opening_hours || "",
        lat, lon
      };
    })
    .filter(Boolean);
}

/* ============================ RENDER ============================ */
function visiblePlaces() {
  let list = places.slice();
  if ($("onlyFilter").checked) list = list.filter((p) => p.only);
  const score = (p) => {
    const s = summaries[p.id];
    return rankScore(s?.avg, s?.count || 0) + (s ? 0 : -10);
  };
  if ($("sortSelect").value === "rating") {
    list.sort((a, b) => score(b) - score(a) || (b.only - a.only) || a.name.localeCompare(b.name, "es"));
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name, "es"));
  }
  return list;
}

function render() {
  const list = visiblePlaces();
  const cards = $("cards");
  cards.innerHTML = "";
  markerLayer.clearLayers();
  for (const k in markers) delete markers[k];

  list.forEach((p) => {
    const s = summaries[p.id];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h2>${esc(p.name)}</h2>
      <div class="meta">
        <span class="badge ${p.only ? "only" : ""}">${p.only ? "100 % sin gluten" : "Opciones sin gluten"}</span>
        ${esc(p.kind)}${p.cuisine ? " · " + esc(p.cuisine) : ""}
      </div>
      ${p.address ? `<div class="meta">📍 ${esc(p.address)}</div>` : ""}
      ${p.hours ? `<div class="meta">🕒 ${esc(p.hours)}</div>` : ""}
      ${p.phone ? `<div class="meta">📞 ${esc(p.phone)}</div>` : ""}
      <div class="rating">
        ${s ? `<span class="stars">${starsText(s.avg)}</span><strong>${s.avg.toFixed(1)}</strong><span class="meta">(${s.count})</span>`
            : `<span class="meta">Aún sin valoraciones</span>`}
      </div>
      <div class="actions">
        <button class="secondary" data-rate="${esc(p.id)}">Valorar</button>
        ${/^https?:\/\//i.test(p.website) ? `<a class="link" href="${esc(p.website)}" target="_blank" rel="noopener noreferrer">Web</a>` : ""}
        <a class="link" href="https://www.openstreetmap.org/${esc(p.id)}" target="_blank" rel="noopener noreferrer">Ver en OSM</a>
      </div>`;
    card.addEventListener("click", (ev) => {
      if (ev.target.closest("button, a")) return;
      map.flyTo([p.lat, p.lon], 17);
      markers[p.id]?.openPopup();
    });
    cards.appendChild(card);

    const m = L.marker([p.lat, p.lon]).bindPopup(
      `<strong>${esc(p.name)}</strong><br>${s ? starsText(s.avg) + " " + s.avg.toFixed(1) + " (" + s.count + ")" : "Sin valoraciones"}`
    );
    m.addTo(markerLayer);
    markers[p.id] = m;
  });

  cards.querySelectorAll("[data-rate]").forEach((b) =>
    b.addEventListener("click", () => openRate(b.dataset.rate)));

  if (list.length) {
    map.fitBounds(L.latLngBounds(list.map((p) => [p.lat, p.lon])).pad(0.15), { maxZoom: 16 });
  }
  $("status").textContent = list.length
    ? `${list.length} sitio${list.length === 1 ? "" : "s"} sin gluten en ${areaName}` +
      ` (${list.filter((p) => p.only).length} 100 % sin gluten, ${Object.keys(summaries).length} con valoraciones).`
    : "No hay resultados con estos filtros.";
}

/* ============================ DIÁLOGO DE VALORACIÓN ============================ */
let currentId = null, currentStars = 0;

function paintStars() {
  $("starPick").innerHTML = [1, 2, 3, 4, 5]
    .map((n) => `<span data-s="${n}">${n <= currentStars ? "★" : "☆"}</span>`).join("");
  $("starPick").querySelectorAll("span").forEach((sp) =>
    sp.addEventListener("click", () => { currentStars = Number(sp.dataset.s); paintStars(); }));
}

async function openRate(id) {
  currentId = id; currentStars = 0;
  const p = places.find((x) => x.id === id);
  $("rateTitle").textContent = p ? p.name : "Valorar";
  $("rateComment").value = "";
  $("storageNotice").textContent = useSupabase ? ""
    : "Modo prueba: tu valoración solo se guarda en este navegador. Conecta Supabase para compartirlas (ver README).";
  paintStars();
  $("commentList").innerHTML = "<div class='meta'>Cargando comentarios…</div>";
  $("rateDialog").showModal();
  try {
    const cs = (await Ratings.comments(id)).filter((c) => c.comment);
    $("commentList").innerHTML = cs.length
      ? cs.map((c) => `<div class="comment"><span class="stars">${starsText(c.stars)}</span><br>${esc(c.comment)}</div>`).join("")
      : "";
  } catch (e) {
    $("commentList").innerHTML = "<div class='meta'>No se pudieron cargar los comentarios.</div>";
  }
}

$("rateCancel").addEventListener("click", () => $("rateDialog").close());
$("rateSave").addEventListener("click", async () => {
  if (!currentStars) { alert("Elige de 1 a 5 estrellas."); return; }
  try {
    await Ratings.add(currentId, currentStars, $("rateComment").value.trim());
    $("rateDialog").close();
    summaries = await Ratings.summary(places.map((p) => p.id));
    render();
  } catch (e) {
    alert("No se pudo guardar la valoración: " + e.message);
  }
});

/* ============================ EVENTOS ============================ */
$("searchForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const city = $("cityInput").value.trim();
  if (!city) return;
  $("status").textContent = "Buscando ciudad…";
  $("cards").innerHTML = "";
  try {
    const geo = await geocode(city);
    areaName = geo.display_name.split(",")[0];
    $("status").textContent = `Ciudad localizada: ${geo.display_name}. Buscando sitios sin gluten…`;
    places = await fetchPlaces(geo);
    $("status").textContent = `${places.length} sitios encontrados en OpenStreetMap. Cargando valoraciones…`;
    try { summaries = await Ratings.summary(places.map((p) => p.id)); }
    catch (e) { summaries = {}; }
    if (!places.length) {
      $("status").textContent = `OSM no tiene sitios etiquetados como sin gluten en ${areaName}. ¡Puedes ayudar añadiendo diet:gluten_free en openstreetmap.org!`;
      markerLayer.clearLayers();
      map.setView([Number(geo.lat), Number(geo.lon)], 12);
      return;
    }
    render();
  } catch (e) {
    $("status").textContent = "⚠️ " + e.message;
  }
});
$("onlyFilter").addEventListener("change", () => places.length && render());
$("sortSelect").addEventListener("change", () => places.length && render());
</script>
</body>
</html>
